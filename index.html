<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPH TechCon V4</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2240%22 fill=%22white%22 text-anchor=%22middle%22>NPH</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .neon-border { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .tab-active { color: #60a5fa; border-bottom: 2px solid #60a5fa; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .login-bg { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .teacher-bg { background: radial-gradient(circle at center, #371b04 0%, #0f172a 100%); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header id="app-header" class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg z-20 hidden">
        <div class="flex justify-between items-center max-w-4xl mx-auto w-full">
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">NPH <span id="header-highlight" class="text-blue-500">TechCon</span></h1>
                <p id="header-subtitle" class="text-xs text-slate-400">Student: ...</p>
            </div>
            <div class="text-right flex items-center gap-2">
                <!-- Teacher Actions -->
                <div id="teacher-actions" class="hidden mr-2">
                    <button onclick="window.exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold transition-colors">
                        <i class="fas fa-file-csv mr-1"></i> Export
                    </button>
                    <button onclick="window.refreshTeacherData()" class="text-slate-400 hover:text-white px-2">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <!-- Sync Status Indicator -->
                <div id="sync-status" class="text-xs font-mono text-slate-500 bg-slate-800 px-2 py-1 rounded border border-slate-700 transition-colors">
                    <i class="fas fa-circle-notch fa-spin mr-1"></i> CONNECTING
                </div>
                <button onclick="window.logout()" class="text-slate-500 hover:text-red-400 ml-2" aria-label="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24 max-w-4xl mx-auto w-full relative">
        <!-- Content injected via JS -->
        <div class="flex items-center justify-center h-full text-slate-500">
            <div class="text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Student Only) -->
    <nav id="app-nav" class="bg-slate-900/95 backdrop-blur border-t border-slate-800 fixed bottom-0 w-full z-30 pb-safe hidden">
        <div class="flex justify-around items-center h-16 max-w-4xl mx-auto">
            <button onclick="window.renderView('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-home">
                <i class="fas fa-home text-lg mb-1"></i><span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.renderView('prep')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-prep">
                <i class="fas fa-clipboard-check text-lg mb-1"></i><span class="text-[10px] font-medium">Get Ready</span>
            </button>
            <button onclick="window.renderView('agenda')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-agenda">
                <i class="fas fa-clock text-lg mb-1"></i><span class="text-[10px] font-medium">Agenda</span>
            </button>
            <button onclick="window.renderView('passport')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-passport">
                <i class="fas fa-passport text-lg mb-1"></i><span class="text-[10px] font-medium">Passport</span>
            </button>
        </div>
    </nav>

    <!-- Teacher Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-2xl rounded-2xl border border-slate-700 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 rounded-t-2xl">
                <div>
                    <h2 class="text-xl font-bold text-white" id="modal-title">Student Name</h2>
                    <p class="text-xs text-slate-400" id="modal-id">ID: ...</p>
                </div>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6" id="modal-content"></div>
            <div class="p-4 border-t border-slate-700 bg-slate-800/30 rounded-b-2xl flex justify-end">
                <button onclick="window.closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i> <span id="toast-msg">Saved!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIqh4WFNa5OarJuiE_28T196AesGJez-4",
            authDomain: "techcon-8b01e.firebaseapp.com",
            projectId: "techcon-8b01e",
            storageBucket: "techcon-8b01e.firebasestorage.app",
            messagingSenderId: "535782934014",
            appId: "1:535782934014:web:a2df7a9fcb292a152aecaf",
            measurementId: "G-J1073SXDQB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = 'nph-techcon-v2';

        // --- STATE ---
        let userMode = 'student'; // 'student' or 'teacher'
        let currentEmail = null;
        let currentView = 'login';
        let isGuestMode = false;
        
        let appData = {
            studentName: '',
            notes: { iot: '', sec: '', ai: '', panel: '', custom_q: '' },
            checklist: { charged: false, pack: false, login: false }
        };

        let teacherData = []; // Stores all student profiles
        let saveTimeout = null;
        let unsubscribeSnapshot = null;

        // --- INIT ---
        const initApp = () => {
            const savedEmail = localStorage.getItem('nph_student_email');
            const savedName = localStorage.getItem('nph_student_name');
            
            if (savedEmail && savedName) {
                currentEmail = savedEmail;
                appData.studentName = savedName;
                startDataListener(currentEmail);
                window.renderView('home');
            } else {
                window.renderView('login');
            }
        };

        // --- STUDENT LOGIC ---
        const startDataListener = (emailKey) => {
            if (isGuestMode) {
                const saved = localStorage.getItem('nph_guest_data');
                if (saved) { try { appData = JSON.parse(saved); updateHeader(); } catch(e) {} }
                updateSyncStatus('guest');
                return;
            }
            if (!emailKey) return;
            
            const safeId = emailKey.replace(/\//g, '_'); 
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    appData = { ...appData, ...docSnap.data() };
                    updateHeader();
                    if (currentView !== 'login' && userMode === 'student') window.renderView(currentView);
                } else {
                    saveToCloud();
                }
                updateSyncStatus('online');
            }, (error) => {
                console.error("Sync error", error);
                updateSyncStatus('offline');
                if(!isGuestMode) {
                    const guestConfirm = confirm("Cloud Connection Failed. Switch to Guest Mode?");
                    if(guestConfirm) window.enableGuestMode(appData.studentName);
                }
            });
        };

        async function saveToCloud() {
            if (isGuestMode) {
                localStorage.setItem('nph_guest_data', JSON.stringify(appData));
                updateSyncStatus('guest');
                return;
            }
            if (!currentEmail) return;
            try {
                const safeId = currentEmail.replace(/\//g, '_');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
                await setDoc(docRef, appData, { merge: true });
                updateSyncStatus('online');
            } catch (e) {
                console.error("Save failed", e);
                updateSyncStatus('offline');
            }
        }

        // --- TEACHER LOGIC ---
        window.attemptTeacherLogin = () => {
            const pin = document.getElementById('teacher-pin').value;
            if (pin === "NPH2025") {
                userMode = 'teacher';
                document.getElementById('teacher-login-error').classList.add('hidden');
                window.renderView('teacher-dashboard');
                window.refreshTeacherData();
            } else {
                document.getElementById('teacher-login-error').classList.remove('hidden');
            }
        };

        window.refreshTeacherData = async () => {
            try {
                updateSyncStatus('syncing');
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'student_profiles'));
                const querySnapshot = await getDocs(q);
                teacherData = [];
                querySnapshot.forEach((doc) => {
                    teacherData.push({ id: doc.id, ...doc.data() });
                });
                if(currentView === 'teacher-dashboard') renderTeacherTable(teacherData);
                updateSyncStatus('online');
            } catch (e) {
                console.error("Teacher Fetch Error", e);
                updateSyncStatus('offline');
            }
        };

        window.deleteStudent = async (id) => {
            if(!confirm("Are you sure you want to PERMANENTLY delete this student's data? This cannot be undone.")) return;
            
            try {
                updateSyncStatus('syncing');
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', id));
                // Update local data immediately
                teacherData = teacherData.filter(s => s.id !== id);
                renderTeacherTable(teacherData);
                updateSyncStatus('online');
                showToast("Student deleted.");
            } catch (e) {
                console.error("Delete failed", e);
                updateSyncStatus('offline');
                alert("Failed to delete. Please check connection.");
            }
        };

        // --- SHARED UI LOGIC ---
        function updateHeader() {
            const subtitle = document.getElementById('header-subtitle');
            const title = document.getElementById('header-highlight');
            
            if (userMode === 'student') {
                title.className = "text-blue-500";
                title.innerText = "TechCon";
                subtitle.innerText = `Student: ${appData.studentName || 'Guest'}`;
                document.getElementById('teacher-actions').classList.add('hidden');
            } else {
                title.className = "text-amber-500";
                title.innerText = "Faculty";
                subtitle.innerText = "Monitor Dashboard";
                document.getElementById('teacher-actions').classList.remove('hidden');
            }
        }

        const updateSyncStatus = (status) => {
            const el = document.getElementById('sync-status');
            if (!el) return;
            
            if (status === 'online') {
                el.innerHTML = '<i class="fas fa-cloud text-emerald-400 mr-1"></i> SYNCED';
                el.className = "text-xs font-mono text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded border border-emerald-400/20 transition-colors";
            } else if (status === 'syncing') {
                el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-400 mr-1"></i> SAVING';
                el.className = "text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded border border-blue-400/20 transition-colors";
            } else if (status === 'guest') {
                el.innerHTML = '<i class="fas fa-hdd text-amber-400 mr-1"></i> LOCAL';
                el.className = "text-xs font-mono text-amber-400 bg-amber-400/10 px-2 py-1 rounded border border-amber-400/20 transition-colors";
            } else {
                el.innerHTML = '<i class="fas fa-wifi-slash text-red-400 mr-1"></i> OFFLINE';
                el.className = "text-xs font-mono text-red-400 bg-red-400/10 px-2 py-1 rounded border border-red-400/20 transition-colors";
            }
        };

        window.renderView = (viewName) => {
            currentView = viewName;
            const container = document.getElementById('app-content');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('app-nav');
            
            updateHeader();

            // Toggle Navigation Visibility
            if (viewName === 'login' || viewName === 'teacher-login') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                if (userMode === 'student') nav.classList.remove('hidden');
                else nav.classList.add('hidden'); // No bottom nav for teachers
            }

            // Student Nav State
            if (userMode === 'student') {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-blue-400');
                    btn.classList.add('text-slate-400');
                });
                const activeBtn = document.getElementById(`nav-${viewName}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-400');
                    activeBtn.classList.add('text-blue-400');
                }
            }

            // Route Render
            if (viewName === 'login') container.innerHTML = getLoginView();
            else if (viewName === 'teacher-login') container.innerHTML = getTeacherLoginView();
            else if (viewName === 'teacher-dashboard') container.innerHTML = getTeacherDashboardView();
            else if (viewName === 'home') container.innerHTML = getHomeView();
            else if (viewName === 'prep') container.innerHTML = getPrepView();
            else if (viewName === 'agenda') container.innerHTML = getAgendaView();
            else if (viewName === 'passport') container.innerHTML = getPassportView();
            
            // Post-render actions
            if (viewName === 'teacher-dashboard') renderTeacherTable(teacherData);
        };

        // --- ACTIONS ---
        window.login = async () => {
            const name = document.getElementById('student-name-input').value.trim();
            const email = document.getElementById('student-email-input').value.trim().toLowerCase();
            
            if (name.length === 0 || email.length === 0) { alert("Please enter both Name and Email."); return; }

            localStorage.setItem('nph_student_email', email);
            localStorage.setItem('nph_student_name', name);
            
            appData.studentName = name; 
            currentEmail = email;
            userMode = 'student';
            
            startDataListener(email);
            window.renderView('home');
        };

        window.enableGuestMode = (name) => {
            isGuestMode = true;
            userMode = 'student';
            appData.studentName = name || "Guest";
            startDataListener(null); 
            window.renderView('home');
            alert("Guest Mode Active: Notes save to THIS device only.");
        };

        window.logout = () => {
            localStorage.removeItem('nph_student_email');
            localStorage.removeItem('nph_student_name');
            currentEmail = null;
            isGuestMode = false;
            userMode = 'student';
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            appData = { studentName: '', notes: { iot: '', sec: '', ai: '', panel: '', custom_q: '' }, checklist: { charged: false, pack: false, login: false } };
            window.renderView('login');
        };

        window.toggleCheck = (key) => { appData.checklist[key] = !appData.checklist[key]; window.renderView('prep'); saveToCloud(); };
        window.saveNote = (key, value) => { 
            appData.notes[key] = value; 
            updateSyncStatus('syncing'); 
            clearTimeout(saveTimeout); 
            saveTimeout = setTimeout(saveToCloud, 500); 
        };

        // --- TEACHER HELPERS ---
        function renderTeacherTable(data) {
            const tbody = document.getElementById('teacher-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No students found yet.</td></tr>`;
                return;
            }

            // Stats
            document.getElementById('stat-count').innerText = data.length;
            document.getElementById('stat-active').innerText = data.filter(s => {
                const n = s.notes || {};
                return (n.iot || n.sec || n.ai || n.panel);
            }).length;

            data.forEach(student => {
                const notes = student.notes || {};
                const has = (txt) => txt && txt.length > 2 ? '<i class="fas fa-check text-emerald-500"></i>' : '<span class="text-slate-600">-</span>';
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/50 transition-colors border-b border-slate-700/50 last:border-0";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">
                        <div>${student.studentName || 'Unknown'}</div>
                        <div class="text-xs text-slate-500 font-mono truncate max-w-[150px]">${student.id}</div>
                    </td>
                    <td class="p-3 text-center">${has(notes.iot)}</td>
                    <td class="p-3 text-center">${has(notes.sec)}</td>
                    <td class="p-3 text-center">${has(notes.ai)}</td>
                    <td class="p-3 text-center">${has(notes.panel)}</td>
                    <td class="p-3 text-right flex items-center justify-end gap-2">
                        <button onclick="window.viewStudent('${student.id}')" class="text-amber-500 hover:text-white hover:bg-amber-600 px-2 py-1 rounded text-xs font-bold uppercase">View</button>
                        <button onclick="window.deleteStudent('${student.id}')" class="text-slate-500 hover:text-white hover:bg-red-600 px-2 py-1 rounded text-xs font-bold transition-colors" title="Delete Student"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.viewStudent = (id) => {
            const student = teacherData.find(s => s.id === id);
            if (!student) return;
            document.getElementById('modal-title').innerText = student.studentName || 'Unknown';
            document.getElementById('modal-id').innerText = student.id;
            const n = student.notes || {};
            const content = document.getElementById('modal-content');
            
            const renderBlock = (title, text, color) => `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h4 class="text-${color}-400 font-bold mb-2 text-sm uppercase">${title}</h4>
                    <p class="text-slate-200 text-sm whitespace-pre-wrap">${text && text.length > 0 ? text : '<span class="text-slate-600 italic">Empty</span>'}</p>
                </div>`;

            content.innerHTML = `
                ${renderBlock('IoT Innovation', n.iot, 'purple')}
                ${renderBlock('Secure the Network', n.sec, 'red')}
                ${renderBlock('AI for Good', n.ai, 'blue')}
                ${renderBlock('Professional Panel', n.panel, 'emerald')}
                ${renderBlock('Custom Questions', n.custom_q, 'amber')}
            `;
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal').classList.add('hidden');

        window.exportCSV = () => {
            if (teacherData.length === 0) { alert("No data."); return; }
            let csv = "Name,Email_ID,IoT Notes,Security Notes,AI Notes,Panel Notes,Custom Questions\n";
            teacherData.forEach(s => {
                const n = s.notes || {};
                const clean = (txt) => `"${(txt || '').replace(/"/g, '""')}"`;
                csv += `${clean(s.studentName)},${clean(s.id)},${clean(n.iot)},${clean(n.sec)},${clean(n.ai)},${clean(n.panel)},${clean(n.custom_q)}\n`;
            });
            const url = window.URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            const a = document.createElement('a');
            a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', 'nph_techcon_data.csv');
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };

        window.filterTeacherList = (term) => {
            const lower = term.toLowerCase();
            const filtered = teacherData.filter(s => (s.studentName && s.studentName.toLowerCase().includes(lower)) || (s.id && s.id.toLowerCase().includes(lower)));
            renderTeacherTable(filtered);
        };

        // --- CLIPBOARD ---
        window.copyAllNotes = () => {
            const fullText = `MY CONVENTION NOTES (${appData.studentName})\n\n[IoT]\n${appData.notes.iot}\n\n[Security]\n${appData.notes.sec}\n\n[AI]\n${appData.notes.ai}\n\n[Panel]\n${appData.notes.panel}\n\n[Qs]\n${appData.notes.custom_q}`;
            const textArea = document.createElement("textarea");
            textArea.value = fullText; textArea.style.position = "fixed"; document.body.appendChild(textArea); textArea.focus(); textArea.select();
            try { document.execCommand("copy"); showToast("Copied!"); } catch (err) { showToast("Copy Failed"); }
            document.body.removeChild(textArea);
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // --- VIEWS ---
        function getLoginView() {
            return `
                <div class="h-full flex flex-col items-center justify-center p-6 login-bg rounded-xl">
                    <div class="w-full max-w-sm text-center">
                        <div class="mb-8"><i class="fas fa-robot text-5xl text-blue-500 mb-4 neon-text"></i><h2 class="text-3xl font-bold text-white">NPH TechCon</h2><p class="text-slate-400 mt-2">Enter your info to sync notes.</p></div>
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl text-left">
                            <div class="mb-4"><label class="block text-xs font-bold text-slate-400 uppercase mb-2">First & Last Name</label><input type="text" id="student-name-input" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none placeholder-slate-600" placeholder="Jane Doe"></div>
                            <div class="mb-6"><label class="block text-xs font-bold text-slate-400 uppercase mb-2">School Email</label><input type="email" id="student-email-input" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none placeholder-slate-600" placeholder="jane.doe@school.edu"></div>
                            <button onclick="window.login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-500/30 mb-4">Start App <i class="fas fa-arrow-right ml-2"></i></button>

            return `<div class="space-y-6 fade-in pt-4"><div class="text-center mb-6"><h2 class="text-2xl font-bold text-white">Get Ready</h2></div><div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg"><h3 class="text-blue-400 font-bold mb-4 flex items-center"><i class="fas fa-tasks mr-2"></i> Student Checklist</h3><div class="space-y-4"><label class="flex items-start cursor-pointer group"><div class="relative flex items-center"><input type="checkbox" id="check-charge" class="peer sr-only" ${isCharged ? 'checked' : ''} onchange="window.toggleCheck('charged')"><div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center"><i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i></div></div><div class="ml-3"><span class="block text-sm font-medium text-slate-200 group-hover:text-white">Charge Laptop to 100%</span></div></label><label class="flex items-start cursor-pointer group"><div class="relative flex items-center"><input type="checkbox" id="check-pack" class="peer sr-only" ${isPack ? 'checked' : ''} onchange="window.toggleCheck('pack')"><div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center"><i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i></div></div><div class="ml-3"><span class="block text-sm font-medium text-slate-200 group-hover:text-white">Pack Laptop Charger</span></div></label><label class="flex items-start cursor-pointer group"><div class="relative flex items-center"><input type="checkbox" id="check-login" class="peer sr-only" ${isLogin ? 'checked' : ''} onchange="window.toggleCheck('login')"><div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center"><i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i></div></div><div class="ml-3"><span class="block text-sm font-medium text-slate-200 group-hover:text-white">Verify School Login</span></div></label></div></div><div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg"><h3 class="text-amber-400 font-bold mb-4 flex items-center"><i class="fas fa-lightbulb mr-2"></i> Panel Q&A Ideas</h3><div class="space-y-3 max-h-60 overflow-y-auto pr-2 mb-4">${questions.map(q => `<div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group"><p class="text-sm text-slate-300 group-hover:text-white">"${q}"</p></div>`).join('')}</div><h3 class="text-amber-400 font-bold mb-2 flex items-center pt-4 border-t border-slate-700"><i class="fas fa-pen mr-2"></i> My Questions</h3><textarea id="note-custom-q" oninput="window.saveNote('custom_q', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500 h-24 placeholder-slate-600" placeholder="I want to ask...">${appData.notes?.custom_q || ''}</textarea></div></div>`;
        }
        function getAgendaView() {
            return `<div class="space-y-4 fade-in pt-4"><div class="flex justify-between items-end mb-2"><h2 class="text-2xl font-bold text-white">Agenda</h2><span class="text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded">NPH Schedule</span></div><div class="relative border-l-2 border-slate-700 ml-3 space-y-8 pb-4"><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-blue-500 border-blue-500"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">9:10 AM</span><i class="fas fa-bus text-slate-500 text-xs"></i></div><h3 class="text-white font-bold text-base mb-1">Bus Departs NPH</h3><p class="text-slate-400 text-xs leading-relaxed">Meet at front entrance.</p></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-slate-900 border-slate-600"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">10:00 AM</span></div><h3 class="text-white font-bold text-base mb-1">Arrival & Check-in</h3><p class="text-slate-400 text-xs leading-relaxed">SSC</p></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-slate-900 border-slate-600"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">10:15 AM</span></div><h3 class="text-white font-bold text-base mb-1">Rotation 1</h3></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-slate-900 border-slate-600"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">11:15 AM</span></div><h3 class="text-white font-bold text-base mb-1">Rotation 2</h3></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-slate-900 border-slate-600"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">12:15 PM</span></div><h3 class="text-white font-bold text-base mb-1">Rotation 3</h3></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-slate-900 border-slate-600"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">1:25 PM</span></div><h3 class="text-white font-bold text-base mb-1">Professional Panel</h3></div></div><div class="relative pl-8"><div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 bg-blue-500 border-blue-500"></div><div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors"><div class="flex justify-between items-start mb-1"><span class="text-blue-400 font-mono text-sm font-bold">2:10 PM</span></div><h3 class="text-white font-bold text-base mb-1">Bus Departs SSC</h3></div></div></div></div>`;
        }
        function getPassportView() {
            const notes1 = appData.notes?.iot || ''; const notes2 = appData.notes?.sec || ''; const notes3 = appData.notes?.ai || ''; const notes4 = appData.notes?.panel || '';
            return `<div class="space-y-6 fade-in pt-4"><div class="text-center"><h2 class="text-2xl font-bold text-white">Digital Passport</h2><p class="text-xs text-slate-400 mt-2 max-w-xs mx-auto">Draft your thoughts here!</p></div><div class="space-y-6"><div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="flex items-center mb-2"><div class="w-2 h-8 bg-purple-500 rounded-full mr-3"></div><h3 class="font-bold text-white">IoT Innovation</h3></div><p class="text-xs text-slate-400 mb-3">What problem were you solving?</p><textarea id="note-iot" oninput="window.saveNote('iot', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 h-24 placeholder-slate-600" placeholder="I built a sensor that...">${notes1}</textarea></div><div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="flex items-center mb-2"><div class="w-2 h-8 bg-red-500 rounded-full mr-3"></div><h3 class="font-bold text-white">Secure the Network</h3></div><p class="text-xs text-slate-400 mb-3">Why is protection important?</p><textarea id="note-sec" oninput="window.saveNote('sec', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500 h-24 placeholder-slate-600" placeholder="Cybersecurity matters because...">${notes2}</textarea></div><div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="flex items-center mb-2"><div class="w-2 h-8 bg-blue-500 rounded-full mr-3"></div><h3 class="font-bold text-white">AI for Good</h3></div><p class="text-xs text-slate-400 mb-3">Who benefits from your solution?</p><textarea id="note-ai" oninput="window.saveNote('ai', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 h-24 placeholder-slate-600" placeholder="My solution helps...">${notes3}</textarea></div><div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><div class="flex items-center mb-2"><div class="w-2 h-8 bg-emerald-500 rounded-full mr-3"></div><h3 class="font-bold text-white">Professional Panel</h3></div><p class="text-xs text-slate-400 mb-3">Which career path interested you?</p><textarea id="note-panel" oninput="window.saveNote('panel', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 h-24 placeholder-slate-600" placeholder="I liked the speaker who...">${notes4}</textarea></div></div><div class="sticky bottom-0 pb-4 pt-2 bg-gradient-to-t from-[#0f172a] via-[#0f172a] to-transparent"><button onclick="window.copyAllNotes()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center"><i class="fas fa-copy mr-2"></i> Copy All to Clipboard</button></div></div>`;
        }

        // Start App
        initApp();
    </script>
