<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPH Tech Convention App V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6; 
            border-radius: 4px;
        }

        /* Neon Glow Effects */
        .neon-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        
        .tab-active {
            color: #60a5fa;
            border-bottom: 2px solid #60a5fa;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login Screen Animation */
        .login-bg {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        
        /* Safe area for bottom nav on mobile */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header id="app-header" class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg z-20 hidden">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">NPH <span class="text-blue-500">TechCon</span></h1>
                <p id="student-id-display" class="text-xs text-slate-400">ID: ...</p>
            </div>
            <div class="text-right flex items-center gap-2">
                <div id="sync-status" class="text-xs font-mono text-slate-500 bg-slate-800 px-2 py-1 rounded border border-slate-700 transition-colors">
                    <i class="fas fa-circle-notch fa-spin mr-1"></i> CONNECTING
                </div>
                <button onclick="window.logout()" class="text-slate-500 hover:text-red-400 ml-2" aria-label="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24 max-w-2xl mx-auto w-full relative">
        <!-- Content injected via JS -->
        <div class="flex items-center justify-center h-full text-slate-500">
            <div class="text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
                <p>Loading...</p>
                <p class="text-xs mt-2 text-slate-600">Connecting to Cloud...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="app-nav" class="bg-slate-900/95 backdrop-blur border-t border-slate-800 fixed bottom-0 w-full z-30 pb-safe hidden">
        <div class="flex justify-around items-center h-16 max-w-2xl mx-auto">
            <button onclick="window.renderView('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-home">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.renderView('prep')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-prep">
                <i class="fas fa-clipboard-check text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Get Ready</span>
            </button>
            <button onclick="window.renderView('agenda')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-agenda">
                <i class="fas fa-clock text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Agenda</span>
            </button>
            <button onclick="window.renderView('passport')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-passport">
                <i class="fas fa-passport text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Passport</span>
            </button>
        </div>
    </nav>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i> <span id="toast-msg">Saved!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE SETUP V2 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIqh4WFNa5OarJuiE_28T196AesGJez-4",
            authDomain: "techcon-8b01e.firebaseapp.com",
            projectId: "techcon-8b01e",
            storageBucket: "techcon-8b01e.firebasestorage.app",
            messagingSenderId: "535782934014",
            appId: "1:535782934014:web:a2df7a9fcb292a152aecaf",
            measurementId: "G-J1073SXDQB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Using a distinct ID for V2 to keep data organized in your Firestore
        const appId = 'nph-techcon-v2';

        let currentUser = null; // Firebase User
        let studentId = localStorage.getItem('nph_student_id'); // Custom Student ID
        let currentView = 'login';
        
        // Local state cache
        let appData = {
            notes: { iot: '', sec: '', ai: '', panel: '' },
            checklist: { charged: false, pack: false, login: false }
        };

        let saveTimeout = null;
        let unsubscribeSnapshot = null;

        // --- AUTH & DATA SYNC ---
        const initAuth = async () => {
            try {
                // Anonymous auth is standard for this type of public app
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth failed - check Firebase Console > Authentication > Sign-in method > Enable Anonymous", e);
                updateSyncStatus('offline');
            }
        };

        const updateSyncStatus = (status) => {
            const el = document.getElementById('sync-status');
            if (!el) return;
            
            if (status === 'online') {
                el.innerHTML = '<i class="fas fa-cloud text-emerald-400 mr-1"></i> SYNCED';
                el.className = "text-xs font-mono text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded border border-emerald-400/20 transition-colors";
            } else if (status === 'syncing') {
                el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-400 mr-1"></i> SAVING';
                el.className = "text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded border border-blue-400/20 transition-colors";
            } else {
                el.innerHTML = '<i class="fas fa-wifi-slash text-red-400 mr-1"></i> OFFLINE';
                el.className = "text-xs font-mono text-red-400 bg-red-400/10 px-2 py-1 rounded border border-red-400/20 transition-colors";
            }
        };

        const startDataListener = () => {
            if (!studentId || !currentUser) return;

            // Using PUBLIC data collection so multiple devices can access the same ID
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', studentId);
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    appData = { ...appData, ...data };
                    
                    if (currentView !== 'login') {
                        if (currentView === 'prep' || currentView === 'passport') {
                            window.renderView(currentView);
                        }
                    }
                } else {
                    console.log("Initializing new student profile in Firestore...");
                    saveToCloud();
                }
                updateSyncStatus('online');
            }, (error) => {
                console.error("Sync error", error);
                updateSyncStatus('offline');
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if (studentId) {
                    startDataListener();
                    window.renderView('home');
                } else {
                    window.renderView('login');
                }
            }
        });

        // Start Auth
        initAuth();

        // --- DATA ---
        const agendaData = [
            { time: "9:10 AM", event: "Bus Departs NPH", icon: "fa-bus", type: "travel", desc: "Meet at front entrance. Don't be late!" },
            { time: "10:00 AM", event: "Arrival & Check-in", icon: "fa-map-marker-alt", type: "logistics", desc: "GMCS Student Support Center (SSC)" },
            { time: "10:15 AM", event: "Rotation 1", icon: "fa-sync-alt", type: "session", desc: "IoT, Security, or AI Challenge" },
            { time: "11:15 AM", event: "Rotation 2", icon: "fa-sync-alt", type: "session", desc: "Switch stations" },
            { time: "12:15 PM", event: "Rotation 3", icon: "fa-sync-alt", type: "session", desc: "Final station" },
            { time: "1:25 PM", event: "Professional Panel", icon: "fa-users", type: "highlight", desc: "Industry insights & Q&A" },
            { time: "2:10 PM", event: "Bus Departs SSC", icon: "fa-bus", type: "travel", desc: "Return trip to Navajo Pine HS" }
        ];

        const rotationsData = [
            { title: "IoT Innovation", icon: "fa-microchip", color: "text-purple-400", bg: "bg-purple-400/10", desc: "Design thinking and connected devices." },
            { title: "Secure the Network", icon: "fa-shield-alt", color: "text-red-400", bg: "bg-red-400/10", desc: "Cybersecurity defense strategies." },
            { title: "AI for Good", icon: "fa-robot", color: "text-blue-400", bg: "bg-blue-400/10", desc: "Solving real problems with Artificial Intelligence." }
        ];

        // --- GLOBAL FUNCTIONS (Attached to Window) ---

        window.login = () => {
            const input = document.getElementById('student-id-input');
            const id = input.value.trim();
            if (id.length > 0) {
                studentId = id;
                localStorage.setItem('nph_student_id', id);
                startDataListener();
                window.renderView('home');
            } else {
                alert("Please enter a valid Student ID");
            }
        };

        window.logout = () => {
            studentId = null;
            localStorage.removeItem('nph_student_id');
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            appData = {
                notes: { iot: '', sec: '', ai: '', panel: '' },
                checklist: { charged: false, pack: false, login: false }
            };
            window.renderView('login');
        };

        window.renderView = (viewName) => {
            currentView = viewName;
            const container = document.getElementById('app-content');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('app-nav');
            
            if (viewName === 'login') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
                container.innerHTML = getLoginView();
                return;
            } else {
                header.classList.remove('hidden');
                nav.classList.remove('hidden');
                document.getElementById('student-id-display').textContent = `ID: ${studentId}`;
            }
            
            // Update Navigation State
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-blue-400');
                btn.classList.add('text-slate-400');
            });
            
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-blue-400');
            }

            // Render Content
            if (viewName === 'home') container.innerHTML = getHomeView();
            else if (viewName === 'prep') container.innerHTML = getPrepView();
            else if (viewName === 'agenda') container.innerHTML = getAgendaView();
            else if (viewName === 'passport') container.innerHTML = getPassportView();
            
            // Scroll to top
            container.scrollTop = 0;
        };

        window.toggleCheck = (key) => {
            if (!currentUser || !studentId) return;
            appData.checklist[key] = !appData.checklist[key];
            window.renderView('prep'); 
            saveToCloud();
        };

        window.saveNote = (key, value) => {
            if (!currentUser || !studentId) return;
            appData.notes[key] = value;
            updateSyncStatus('syncing');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveToCloud();
            }, 1000);
        };

        window.copyAllNotes = () => {
            const n1 = appData.notes.iot || "No notes.";
            const n2 = appData.notes.sec || "No notes.";
            const n3 = appData.notes.ai || "No notes.";
            const n4 = appData.notes.panel || "No notes.";
            const fullText = `MY CONVENTION NOTES\n\n[IoT Innovation]\n${n1}\n\n[Secure the Network]\n${n2}\n\n[AI for Good]\n${n3}\n\n[Panel]\n${n4}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                 navigator.clipboard.writeText(fullText).then(() => {
                    showToast("Copied to Clipboard!");
                }).catch(err => {
                    fallbackCopy(fullText);
                });
            } else {
                fallbackCopy(fullText);
            }
        };

        function fallbackCopy(text) {
             const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand("copy");
                showToast("Copied to Clipboard!");
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showToast("Copy Failed");
            }
            document.body.removeChild(textArea);
        }

        // --- INTERNAL HELPERS ---
        
        async function saveToCloud() {
            if (!currentUser || !studentId) return;
            try {
                // Using PUBLIC path for sharing based on ID
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', studentId);
                await setDoc(docRef, appData, { merge: true });
                updateSyncStatus('online');
            } catch (e) {
                console.error("Save failed", e);
                updateSyncStatus('offline');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // --- VIEW GENERATORS ---

        function getLoginView() {
            return `
                <div class="h-full flex flex-col items-center justify-center p-6 login-bg rounded-xl">
                    <div class="w-full max-w-sm text-center">
                        <div class="mb-8">
                            <i class="fas fa-fingerprint text-5xl text-blue-500 mb-4 neon-text"></i>
                            <h2 class="text-3xl font-bold text-white">Student Login</h2>
                            <p class="text-slate-400 mt-2">Enter your School ID to sync your notes across devices.</p>
                        </div>
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                            <label class="block text-left text-xs font-bold text-slate-400 uppercase mb-2">Student ID</label>
                            <input type="text" id="student-id-input" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:border-blue-500 focus:outline-none text-center font-mono text-lg tracking-widest" placeholder="12345">
                            <button onclick="window.login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg mt-4 transition-all shadow-lg shadow-blue-500/30">
                                ACCESS APP <i class="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                        <p class="text-xs text-slate-500 mt-6">Navajo Pine High School • TechCon 2025</p>
                    </div>
                </div>
            `;
        }

        function getHomeView() {
            return `
                <div class="space-y-6 fade-in pt-4">
                    <!-- Hero Card -->
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 border border-slate-700 neon-border text-center relative overflow-hidden">
                        <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-blue-500 rounded-full blur-3xl opacity-20"></div>
                        <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">Connect. Protect. Empower.</h2>
                        <p class="text-slate-400 text-sm mb-4">Navajo Pine High School</p>
                        <div class="inline-block px-4 py-1 rounded-full bg-slate-800 border border-slate-600 text-xs font-mono text-slate-300">
                            <i class="far fa-calendar-alt mr-2"></i>Thursday, Jan 15
                        </div>
                    </div>
                    <!-- Quick Actions -->
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="window.renderView('prep')" class="bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-blue-500 transition-all text-left group">
                            <div class="bg-blue-500/10 w-10 h-10 rounded-lg flex items-center justify-center mb-3 group-hover:bg-blue-500/20">
                                <i class="fas fa-clipboard-check text-blue-400"></i>
                            </div>
                            <h3 class="font-bold text-slate-200">Pre-Check</h3>
                            <p class="text-xs text-slate-500 mt-1">Get ready for tomorrow</p>
                        </button>
                        <button onclick="window.renderView('passport')" class="bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-emerald-500 transition-all text-left group">
                            <div class="bg-emerald-500/10 w-10 h-10 rounded-lg flex items-center justify-center mb-3 group-hover:bg-emerald-500/20">
                                <i class="fas fa-pen-fancy text-emerald-400"></i>
                            </div>
                            <h3 class="font-bold text-slate-200">Notes</h3>
                            <p class="text-xs text-slate-500 mt-1">Draft your reflection</p>
                        </button>
                    </div>
                    <!-- Rotation Preview -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 ml-1">Learning Rotations</h3>
                        <div class="space-y-3">
                            ${rotationsData.map(r => `
                                <div class="flex items-center p-3 bg-slate-800 rounded-lg border border-slate-700/50">
                                    <div class="${r.bg} w-10 h-10 rounded-lg flex items-center justify-center mr-3">
                                        <i class="fas ${r.icon} ${r.color}"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-200 text-sm">${r.title}</h4>
                                        <p class="text-xs text-slate-500">${r.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function getPrepView() {
            const isCharged = appData.checklist?.charged || false;
            const isPack = appData.checklist?.pack || false;
            const isLogin = appData.checklist?.login || false;

            return `
                <div class="space-y-6 fade-in pt-4">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-bold text-white">Get Ready</h2>
                        <p class="text-sm text-slate-400">Complete this checklist the night before.</p>
                    </div>
                    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg">
                        <h3 class="text-blue-400 font-bold mb-4 flex items-center">
                            <i class="fas fa-tasks mr-2"></i> Student Checklist
                        </h3>
                        <div class="space-y-4">
                            <label class="flex items-start cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="check-charge" class="peer sr-only" ${isCharged ? 'checked' : ''} onchange="window.toggleCheck('charged')">
                                    <div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center">
                                        <i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i>
                                    </div>
                                </div>
                                <div class="ml-3">
                                    <span class="block text-sm font-medium text-slate-200 group-hover:text-white">Charge Laptop to 100%</span>
                                    <span class="block text-xs text-slate-500">Crucial: Power outlets may be limited.</span>
                                </div>
                            </label>
                            <label class="flex items-start cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="check-pack" class="peer sr-only" ${isPack ? 'checked' : ''} onchange="window.toggleCheck('pack')">
                                    <div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center">
                                        <i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i>
                                    </div>
                                </div>
                                <div class="ml-3">
                                    <span class="block text-sm font-medium text-slate-200 group-hover:text-white">Pack Laptop Charger</span>
                                    <span class="block text-xs text-slate-500">Bring it just in case.</span>
                                </div>
                            </label>
                            <label class="flex items-start cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" id="check-login" class="peer sr-only" ${isLogin ? 'checked' : ''} onchange="window.toggleCheck('login')">
                                    <div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center">
                                        <i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i>
                                    </div>
                                </div>
                                <div class="ml-3">
                                    <span class="block text-sm font-medium text-slate-200 group-hover:text-white">Verify School Login</span>
                                    <span class="block text-xs text-slate-500">Ensure your password works before leaving.</span>
                                </div>
                            </label>
                        </div>
                    </div>
                     <!-- Question Bank -->
                    <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg">
                        <h3 class="text-amber-400 font-bold mb-4 flex items-center">
                            <i class="fas fa-lightbulb mr-2"></i> Panel Q&A Ideas
                        </h3>
                        <p class="text-xs text-slate-400 mb-4">Don't know what to ask the pros? Try these:</p>
                        
                        <div class="space-y-3">
                            <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group">
                                <p class="text-sm text-slate-300 group-hover:text-white">"Do I really need a college degree, or are certifications enough?"</p>
                            </div>
                            <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group">
                                <p class="text-sm text-slate-300 group-hover:text-white">"How did you get your very first job in tech?"</p>
                            </div>
                            <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group">
                                <p class="text-sm text-slate-300 group-hover:text-white">"What does a 'bad day' at work look like for you?"</p>
                            </div>
                             <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group">
                                <p class="text-sm text-slate-300 group-hover:text-white">"What classes in high school actually helped you the most?"</p>
                            </div>
                        </div>
                    </div>
                    <!-- Departure Alert -->
                    <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-start">
                        <i class="fas fa-bus text-red-400 mt-1 mr-3 text-lg"></i>
                        <div>
                            <h4 class="font-bold text-red-100 text-sm">Morning Schedule</h4>
                            <p class="text-xs text-red-200/70 mt-1 leading-relaxed">
                                Arrive by <strong class="text-white">9:00 AM</strong> to eat breakfast. 
                                The bus departs <strong class="text-white">NPH at 9:10 AM sharp</strong>.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function getAgendaView() {
            return `
                <div class="space-y-4 fade-in pt-4">
                    <div class="flex justify-between items-end mb-2">
                        <h2 class="text-2xl font-bold text-white">Agenda</h2>
                        <span class="text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded">NPH Schedule</span>
                    </div>
                    <div class="relative border-l-2 border-slate-700 ml-3 space-y-8 pb-4">
                        ${agendaData.map((item, index) => `
                            <div class="relative pl-8">
                                <div class="absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 ${index === 0 || index === 6 ? 'bg-blue-500 border-blue-500' : 'bg-slate-900 border-slate-600'}"></div>
                                <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 hover:border-slate-600 transition-colors">
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="text-blue-400 font-mono text-sm font-bold">${item.time}</span>
                                        <i class="fas ${item.icon} text-slate-500 text-xs"></i>
                                    </div>
                                    <h3 class="text-white font-bold text-base mb-1">${item.event}</h3>
                                    <p class="text-slate-400 text-xs leading-relaxed">${item.desc}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function getPassportView() {
            const notes1 = appData.notes?.iot || '';
            const notes2 = appData.notes?.sec || '';
            const notes3 = appData.notes?.ai || '';
            const notes4 = appData.notes?.panel || '';

            return `
                <div class="space-y-6 fade-in pt-4">
                    <div class="text-center">
                        <h2 class="text-2xl font-bold text-white">Digital Passport</h2>
                        <p class="text-xs text-slate-400 mt-2 max-w-xs mx-auto">
                            <span class="text-amber-400"><i class="fas fa-exclamation-triangle"></i> Note for NPH Students:</span>
                            This is a <strong>Draft Space</strong>. Use this to remember your thoughts!
                        </p>
                    </div>
                    <div class="space-y-6">
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex items-center mb-2">
                                <div class="w-2 h-8 bg-purple-500 rounded-full mr-3"></div>
                                <h3 class="font-bold text-white">IoT Innovation</h3>
                            </div>
                            <p class="text-xs text-slate-400 mb-3">What problem were you solving?</p>
                            <textarea id="note-iot" oninput="window.saveNote('iot', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 h-24 placeholder-slate-600" placeholder="I built a sensor that...">${notes1}</textarea>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex items-center mb-2">
                                <div class="w-2 h-8 bg-red-500 rounded-full mr-3"></div>
                                <h3 class="font-bold text-white">Secure the Network</h3>
                            </div>
                            <p class="text-xs text-slate-400 mb-3">Why is protection important?</p>
                            <textarea id="note-sec" oninput="window.saveNote('sec', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500 h-24 placeholder-slate-600" placeholder="Cybersecurity matters because...">${notes2}</textarea>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex items-center mb-2">
                                <div class="w-2 h-8 bg-blue-500 rounded-full mr-3"></div>
                                <h3 class="font-bold text-white">AI for Good</h3>
                            </div>
                            <p class="text-xs text-slate-400 mb-3">Who benefits from your solution?</p>
                            <textarea id="note-ai" oninput="window.saveNote('ai', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500 h-24 placeholder-slate-600" placeholder="My solution helps...">${notes3}</textarea>
                        </div>
                        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div class="flex items-center mb-2">
                                <div class="w-2 h-8 bg-emerald-500 rounded-full mr-3"></div>
                                <h3 class="font-bold text-white">Professional Panel</h3>
                            </div>
                            <p class="text-xs text-slate-400 mb-3">Which career path interested you?</p>
                            <textarea id="note-panel" oninput="window.saveNote('panel', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 h-24 placeholder-slate-600" placeholder="I liked the speaker who...">${notes4}</textarea>
                        </div>
                    </div>
                    <div class="sticky bottom-0 pb-4 pt-2 bg-gradient-to-t from-[#0f172a] via-[#0f172a] to-transparent">
                        <button onclick="window.copyAllNotes()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center">
                            <i class="fas fa-copy mr-2"></i> Copy All to Clipboard
                        </button>
                        <p class="text-center text-[10px] text-slate-500 mt-2">Paste into your College & Career Passport later.</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
