<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPH TechCon</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2240%22 fill=%22white%22 text-anchor=%22middle%22>NPH</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .stamp-animation { animation: stampIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes stampIn { 
            0% { opacity: 0; transform: scale(2) rotate(-10deg); } 
            100% { opacity: 1; transform: scale(1) rotate(-10deg); } 
        }

        .login-bg { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        html:not(.dark) .login-bg { background: radial-gradient(circle at center, #f1f5f9 0%, #cbd5e1 100%); }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-200 transition-colors duration-300">

    <!-- Header -->
    <header id="app-header" class="bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 p-4 shadow-sm dark:shadow-lg z-20 hidden transition-colors duration-300">
        <div class="flex justify-between items-center max-w-4xl mx-auto w-full">
            <div>
                <h1 class="text-xl font-bold text-slate-900 dark:text-white tracking-wide">NPH <span id="header-highlight" class="text-blue-600 dark:text-blue-500">TechCon</span></h1>
                <p id="header-subtitle" class="text-xs text-slate-500 dark:text-slate-400">Student: ...</p>
            </div>
            <div class="text-right flex items-center gap-2">
                <!-- Theme Toggle -->
                <button onclick="window.toggleTheme()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-2 rounded-full transition-colors">
                    <i class="fas fa-sun block dark:hidden"></i>
                    <i class="fas fa-moon hidden dark:block"></i>
                </button>

                <!-- Teacher Actions -->
                <div id="teacher-actions" class="hidden flex items-center gap-2 mr-2">
                    <button onclick="window.renderView('teacher-dashboard')" id="btn-dash" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors">
                        <i class="fas fa-list mr-1"></i> Data
                    </button>
                    <button onclick="window.renderView('teacher-presentation')" id="btn-slides" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors">
                        <i class="fas fa-chalkboard mr-1"></i> Slides
                    </button>
                    <div class="h-4 w-px bg-gray-300 dark:bg-slate-700 mx-1"></div>
                    <button onclick="window.exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold transition-colors">
                        <i class="fas fa-file-csv mr-1"></i> Export
                    </button>
                    <button onclick="window.refreshTeacherData()" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white px-2">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <!-- Sync Status Indicator -->
                <div id="sync-status" class="text-xs font-mono text-slate-500 dark:text-slate-500 bg-gray-100 dark:bg-slate-800 px-2 py-1 rounded border border-gray-200 dark:border-slate-700 transition-colors">
                    <i class="fas fa-circle-notch fa-spin mr-1"></i> CONNECTING
                </div>
                <button onclick="window.logout()" class="text-slate-400 hover:text-red-500 ml-1 px-2" aria-label="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24 max-w-4xl mx-auto w-full relative">
        <!-- Content injected via JS -->
        <div class="flex items-center justify-center h-full text-slate-500">
            <div class="text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Student Only) -->
    <nav id="app-nav" class="bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-gray-200 dark:border-slate-800 fixed bottom-0 w-full z-30 pb-safe hidden transition-colors duration-300">
        <div class="flex justify-around items-center h-16 max-w-4xl mx-auto">
            <button onclick="window.renderView('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-500 transition-colors" id="nav-home">
                <i class="fas fa-home text-lg mb-1"></i><span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.renderView('prep')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-500 transition-colors" id="nav-prep">
                <i class="fas fa-clipboard-check text-lg mb-1"></i><span class="text-[10px] font-medium">Get Ready</span>
            </button>
            <button onclick="window.renderView('agenda')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-500 transition-colors" id="nav-agenda">
                <i class="fas fa-clock text-lg mb-1"></i><span class="text-[10px] font-medium">Agenda</span>
            </button>
            <button onclick="window.renderView('passport')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-500 transition-colors" id="nav-passport">
                <i class="fas fa-passport text-lg mb-1"></i><span class="text-[10px] font-medium">Passport</span>
            </button>
            <button onclick="window.renderView('reflection')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-500 transition-colors" id="nav-reflection">
                <i class="fas fa-star text-lg mb-1"></i><span class="text-[10px] font-medium">Reflection</span>
            </button>
        </div>
    </nav>

    <!-- Teacher Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl rounded-2xl border border-gray-200 dark:border-slate-700 shadow-2xl flex flex-col max-h-[90vh] transition-colors duration-300">
            <div class="p-6 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-800/50 rounded-t-2xl">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white" id="modal-title">Student Name</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400" id="modal-id">ID: ...</p>
                </div>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white bg-transparent hover:bg-gray-100 dark:hover:bg-slate-700 w-8 h-8 rounded-full transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6" id="modal-content"></div>
            <div class="p-4 border-t border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800/30 rounded-b-2xl flex justify-end">
                <button onclick="window.closeModal()" class="bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-white px-4 py-2 rounded-lg text-sm font-bold">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i> <span id="toast-msg">Saved!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIqh4WFNa5OarJuiE_28T196AesGJez-4",
            authDomain: "techcon-8b01e.firebaseapp.com",
            projectId: "techcon-8b01e",
            storageBucket: "techcon-8b01e.firebasestorage.app",
            messagingSenderId: "535782934014",
            appId: "1:535782934014:web:a2df7a9fcb292a152aecaf",
            measurementId: "G-J1073SXDQB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'nph-techcon-v2';

        // --- STATE ---
        let userMode = 'student'; // 'student' or 'teacher'
        let currentEmail = null;
        let currentView = 'login';
        let currentPassportTab = 'iot'; // NEW: Track active tab in passport
        let isGuestMode = false;
        
        let appData = {
            studentName: '',
            classPeriod: '', // NEW: Added field
            notes: { iot: '', sec: '', ai: '', panel: '', custom_q: '' },
            checklist: { charged: false, pack: false, login: false, cisco: false },
            reflection: { q1: '', q2: [], q3: [], q4: '', q5: '', q6: '', q7: '' },
            teacherComment: '',
            teacherReviews: {} // Stores review status for individual items { 'iot': true, 'q1': false }
        };

        let teacherData = []; 
        let saveTimeout = null;
        let unsubscribeSnapshot = null;
        let presenceInterval = null;

        // --- AUTH & INIT ---
        const initAuth = async () => {
            try {
                // Try to sign in with the environment's custom token first
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    // If no token exists, force error to trigger fallback
                    throw new Error("No initial token");
                }
            } catch (error) {
                // If custom token fails (e.g. project mismatch due to manual config) or is missing,
                // fall back to Anonymous Auth which works for the specific projectId
                console.warn("Custom token auth failed, switching to anonymous:", error.message);
                try {
                    await signInAnonymously(auth);
                } catch (anonError) {
                    console.error("Anonymous Auth Critical Error:", anonError);
                    updateSyncStatus('offline');
                }
            }
        };

        const initApp = () => {
            // Restore theme
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            }

            const savedEmail = localStorage.getItem('nph_student_email');
            const savedName = localStorage.getItem('nph_student_name');
            const savedPeriod = localStorage.getItem('nph_student_period');
            
            if (savedEmail && savedName) {
                currentEmail = savedEmail;
                appData.studentName = savedName;
                if(savedPeriod) appData.classPeriod = savedPeriod;
                startDataListener(currentEmail);
                window.renderView('home');
            } else {
                window.renderView('login');
            }
        };

        // --- THEME ---
        window.toggleTheme = () => {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        };

        // --- STUDENT LOGIC ---
        const startDataListener = (emailKey) => {
            if (isGuestMode) {
                const saved = localStorage.getItem('nph_guest_data');
                if (saved) { try { appData = JSON.parse(saved); updateHeader(); } catch(e) {} }
                updateSyncStatus('guest');
                return;
            }
            if (!emailKey || !auth.currentUser) return;
            
            const safeId = emailKey.replace(/\//g, '_'); 
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            // Clear any existing heartbeat
            if (presenceInterval) clearInterval(presenceInterval);
            
            // Initial heartbeat
            saveToCloud(true);
            
            // Start heartbeat interval (every 2 minutes) to keep "Online" status green
            presenceInterval = setInterval(() => saveToCloud(true), 120000);

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const fetchedData = docSnap.data();
                    
                    // Smart Diff: Check if data actually changed to avoid re-rendering and losing focus
                    // We exclude 'lastActive' from the check because that changes constantly on heartbeat
                    const currentClean = { ...appData }; delete currentClean.lastActive;
                    const fetchedClean = { ...fetchedData }; delete fetchedClean.lastActive;
                    const hasContentChanged = JSON.stringify(currentClean) !== JSON.stringify(fetchedClean);

                    appData = {
                        ...appData,
                        ...fetchedData,
                        reflection: { ...appData.reflection, ...(fetchedData.reflection || {}) },
                        notes: { ...appData.notes, ...(fetchedData.notes || {}) },
                        checklist: { ...appData.checklist, ...(fetchedData.checklist || {}) },
                        teacherReviews: { ...appData.teacherReviews, ...(fetchedData.teacherReviews || {}) }
                    };
                    updateHeader();
                    
                    // Only re-render if content changed OR if we are moving from login to home
                    if (userMode === 'student') {
                        if (currentView === 'login' || hasContentChanged) {
                            window.renderView(currentView === 'login' ? 'home' : currentView);
                        }
                    }
                } else {
                    saveToCloud(true);
                }
                updateSyncStatus('online');
            }, (error) => {
                console.error("Sync error", error);
                updateSyncStatus('offline');
                // Removed auto-prompt for guest mode to prevent spamming
            });
        };

        async function saveToCloud(silent = false) {
            if (isGuestMode) {
                localStorage.setItem('nph_guest_data', JSON.stringify(appData));
                updateSyncStatus('guest');
                return;
            }
            if (!currentEmail || !auth.currentUser) return;
            try {
                const safeId = currentEmail.replace(/\//g, '_');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
                // Add lastActive timestamp for teacher dashboard
                const dataToSave = { ...appData, lastActive: Date.now() };
                await setDoc(docRef, dataToSave, { merge: true });
                updateSyncStatus('online');
                if (!silent) showToast("Saved!"); // Only show toast on manual saves
            } catch (e) {
                console.error("Save failed", e);
                updateSyncStatus('offline');
            }
        }

        // --- TEACHER LOGIC ---
        window.attemptTeacherLogin = () => {
            const pin = document.getElementById('teacher-pin').value;
            if (pin === "NPH2025") {
                userMode = 'teacher';
                document.getElementById('teacher-login-error').classList.add('hidden');
                window.renderView('teacher-dashboard');
                window.refreshTeacherData();
            } else {
                document.getElementById('teacher-login-error').classList.remove('hidden');
            }
        };

        window.refreshTeacherData = async () => {
            if (!auth.currentUser) return;
            try {
                updateSyncStatus('syncing');
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'student_profiles'));
                const querySnapshot = await getDocs(q);
                teacherData = [];
                querySnapshot.forEach((doc) => {
                    teacherData.push({ id: doc.id, ...doc.data() });
                });
                
                if(currentView === 'teacher-dashboard') {
                    // Reset filter visual to 'All' on refresh, or keep previous logic if desired
                    // For now, render full list
                    renderTeacherTable(teacherData);
                }
                if(currentView === 'teacher-presentation') window.renderView('teacher-presentation'); 
                
                updateSyncStatus('online');
            } catch (e) {
                console.error("Teacher Fetch Error", e);
                updateSyncStatus('offline');
            }
        };

        window.deleteStudent = async (id) => {
            if(!confirm("Are you sure? This cannot be undone.")) return;
            try {
                updateSyncStatus('syncing');
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', id));
                teacherData = teacherData.filter(s => s.id !== id);
                renderTeacherTable(teacherData);
                updateSyncStatus('online');
                showToast("Deleted.");
            } catch (e) {
                updateSyncStatus('offline');
                alert("Failed to delete.");
            }
        };

        window.saveTeacherComment = async (studentId) => {
            const comment = document.getElementById('teacher-comment-input').value;
            try {
                updateSyncStatus('syncing');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', studentId);
                await setDoc(docRef, { teacherComment: comment }, { merge: true });
                const s = teacherData.find(s => s.id === studentId);
                if (s) s.teacherComment = comment;
                showToast("Feedback Saved!");
                updateSyncStatus('online');
            } catch (e) {
                alert("Failed to save feedback.");
            }
        };

        window.toggleItemReview = async (studentId, key, isChecked) => {
            try {
                updateSyncStatus('syncing');
                // Optimistic Update
                const s = teacherData.find(s => s.id === studentId);
                if(s) {
                    if(!s.teacherReviews) s.teacherReviews = {};
                    s.teacherReviews[key] = isChecked;
                }

                // Firestore Update
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', studentId);
                const updatePayload = {};
                updatePayload[`teacherReviews.${key}`] = isChecked;
                
                await setDoc(docRef, updatePayload, { merge: true });
                updateSyncStatus('online');
            } catch(e) {
                console.error("Toggle review failed", e);
                updateSyncStatus('offline');
            }
        }

        window.switchModalTab = (tabName) => {
            // Hide all tabs
            ['overview', 'passport', 'reflection'].forEach(t => {
                const el = document.getElementById(`modal-tab-${t}`);
                const btn = document.getElementById(`btn-modal-${t}`);
                if (el) el.classList.add('hidden');
                if (btn) {
                    btn.classList.remove('text-blue-600', 'dark:text-blue-400', 'border-b-2', 'border-blue-600', 'dark:border-blue-400');
                    btn.classList.add('text-slate-500', 'dark:text-slate-400');
                }
            });
            
            // Show selected
            const targetEl = document.getElementById(`modal-tab-${tabName}`);
            const targetBtn = document.getElementById(`btn-modal-${tabName}`);
            if (targetEl) targetEl.classList.remove('hidden');
            if (targetBtn) {
                targetBtn.classList.remove('text-slate-500', 'dark:text-slate-400');
                targetBtn.classList.add('text-blue-600', 'dark:text-blue-400', 'border-b-2', 'border-blue-600', 'dark:border-blue-400');
            }
        };

        // --- SHARED UI LOGIC ---
        function updateHeader() {
            const subtitle = document.getElementById('header-subtitle');
            const title = document.getElementById('header-highlight');
            
            if (userMode === 'student') {
                title.className = "text-blue-600 dark:text-blue-500";
                title.innerText = "TechCon";
                subtitle.innerText = `Student: ${appData.studentName || 'Guest'}`;
                document.getElementById('teacher-actions').classList.add('hidden');
            } else {
                title.className = "text-amber-500";
                title.innerText = "Faculty";
                subtitle.innerText = "Monitor Dashboard";
                document.getElementById('teacher-actions').classList.remove('hidden');
                
                const btnDash = document.getElementById('btn-dash');
                const btnSlides = document.getElementById('btn-slides');
                
                if(currentView === 'teacher-dashboard' && btnDash) {
                    btnDash.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-white');
                    btnDash.classList.remove('text-slate-500', 'dark:text-slate-400');
                    btnSlides.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-white');
                    btnSlides.classList.add('text-slate-500', 'dark:text-slate-400');
                } else if (currentView === 'teacher-presentation' && btnSlides) {
                    btnSlides.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-white');
                    btnSlides.classList.remove('text-slate-500', 'dark:text-slate-400');
                    btnDash.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'text-blue-600', 'dark:text-white');
                    btnDash.classList.add('text-slate-500', 'dark:text-slate-400');
                }
            }
        }

        const updateSyncStatus = (status) => {
            const el = document.getElementById('sync-status');
            if (!el) return;
            
            if (status === 'online') {
                el.innerHTML = '<i class="fas fa-cloud text-emerald-500 dark:text-emerald-400 mr-1"></i> SYNCED';
                el.className = "text-xs font-mono text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-400/10 px-2 py-1 rounded border border-emerald-100 dark:border-emerald-400/20 transition-colors";
            } else if (status === 'syncing') {
                el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-500 dark:text-blue-400 mr-1"></i> SAVING';
                el.className = "text-xs font-mono text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-400/10 px-2 py-1 rounded border border-blue-100 dark:border-blue-400/20 transition-colors";
            } else if (status === 'guest') {
                el.innerHTML = '<i class="fas fa-hdd text-amber-500 dark:text-amber-400 mr-1"></i> LOCAL';
                el.className = "text-xs font-mono text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-400/10 px-2 py-1 rounded border border-amber-100 dark:border-amber-400/20 transition-colors";
            } else {
                el.innerHTML = '<i class="fas fa-wifi-slash text-red-500 dark:text-red-400 mr-1"></i> OFFLINE';
                el.className = "text-xs font-mono text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-400/10 px-2 py-1 rounded border border-red-100 dark:border-red-400/20 transition-colors";
            }
        };

        window.renderView = (viewName) => {
            currentView = viewName;
            const container = document.getElementById('app-content');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('app-nav');
            
            updateHeader();

            if (viewName === 'login' || viewName === 'teacher-login') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
                // Remove spacing that causes scroll on login
                container.classList.remove('pb-24', 'p-4');
                container.classList.add('p-0');
            } else {
                header.classList.remove('hidden');

        // --- TEACHER HELPERS ---
        function updateTeacherCharts(data) {
            // Q7 Satisfaction
            const counts = { 'Excellent': 0, 'Good': 0, 'Okay': 0, 'Needs Improvement': 0 };
            // Q5 Career Goals
            const goalCounts = { 'More Interested': 0, 'Learned New': 0, 'Still Exploring': 0, 'Not For Me': 0 };
            
            let totalRated = 0;
            let totalGoals = 0;

            data.forEach(s => {
                const r = s.reflection || {};
                
                // Q7
                if (r.q7 && counts[r.q7] !== undefined) {
                    counts[r.q7]++;
                    totalRated++;
                }

                // Q5
                if (r.q5 && goalCounts[r.q5] !== undefined) {
                    goalCounts[r.q5]++;
                    totalGoals++;
                }
            });

            // Update Q7 Bars
            const base = totalRated === 0 ? 1 : totalRated;
            const setBar = (idSuffix, count) => {
                const percent = (count / base) * 100;
                const elBar = document.getElementById(`bar-${idSuffix}`);
                const elVal = document.getElementById(`val-${idSuffix}`);
                if(elBar) elBar.style.width = `${percent}%`;
                if(elVal) elVal.innerText = `${count} (${Math.round(percent)}%)`;
            };

            setBar('excellent', counts['Excellent']);
            setBar('good', counts['Good']);
            setBar('okay', counts['Okay']);
            setBar('bad', counts['Needs Improvement']);

            // Update Q5 Bars
            const baseGoals = totalGoals === 0 ? 1 : totalGoals;
            const setGoalBar = (idSuffix, count) => {
                const percent = (count / baseGoals) * 100;
                const elBar = document.getElementById(`bar-goal-${idSuffix}`);
                const elVal = document.getElementById(`val-goal-${idSuffix}`);
                if(elBar) elBar.style.width = `${percent}%`;
                if(elVal) elVal.innerText = `${count} (${Math.round(percent)}%)`;
            };

            setGoalBar('more', goalCounts['More Interested']);
            setGoalBar('new', goalCounts['Learned New']);
            setGoalBar('still', goalCounts['Still Exploring']);
            setGoalBar('not', goalCounts['Not For Me']);
        }

                `;
            }

            const checkBox = (key, val, label) => {
                const checked = (r[key] || []).includes(val) ? 'checked' : '';
                return `<label class="flex items-center space-x-2 p-2 bg-gray-50 dark:bg-slate-900/50 rounded-lg border border-gray-200 dark:border-slate-700/50 hover:border-blue-500/50 cursor-pointer">
                    <input type="checkbox" class="form-checkbox text-blue-500 rounded bg-white dark:bg-slate-800 border-gray-300 dark:border-slate-600 focus:ring-0 w-4 h-4" ${checked} onchange="window.saveReflection('${key}', '${val}')">
                    <span class="text-xs text-slate-600 dark:text-slate-300 select-none">${label}</span>
                </label>`;
            };

            const radioBox = (key, val, label) => {
                const checked = r[key] === val ? 'checked' : '';
                return `<label class="flex items-center space-x-2 p-2 bg-gray-50 dark:bg-slate-900/50 rounded-lg border border-gray-200 dark:border-slate-700/50 hover:border-blue-500/50 cursor-pointer">
                    <input type="radio" name="${key}" class="form-radio text-blue-500 bg-white dark:bg-slate-800 border-gray-300 dark:border-slate-600 focus:ring-0 w-4 h-4" ${checked} onchange="window.saveReflection('${key}', '${val}')">
                    <span class="text-xs text-slate-600 dark:text-slate-300 select-none">${label}</span>
                </label>`;
            };

            return `<div class="space-y-3 fade-in pt-2 pb-24 relative">
                    ${getReviewStamp()}
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Event Reflection</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Wrap up your experience.</p>
                    </div>

                    ${feedbackHTML}

                    <!-- Q1 -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getStamp('reflection')}
                        ${getTeacherStamp('q1')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-1">1. Biggest takeaway?</h3>
                        <textarea oninput="window.saveReflection('q1', this.value)" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-lg p-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-blue-500 h-16 placeholder-slate-400 dark:placeholder-slate-600 resize-none" placeholder="I learned that...">${r.q1 || ''}</textarea>
                    </div>

                    <!-- Q2 Careers -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q2')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-2">2. Career paths explored?</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${checkBox('q2', 'Engineering', 'Engineering')}
                            ${checkBox('q2', 'Health / Biomedical', 'Health')}
                            ${checkBox('q2', 'Business', 'Business')}
                            ${checkBox('q2', 'Media', 'Media')}
                            ${checkBox('q2', 'Tech / Cyber', 'Tech')}
                            ${checkBox('q2', 'Trades', 'Trades')}
                        </div>
                    </div>

                    <!-- Q3 Skills -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q3')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-1">3. GMCS Skills Used</h3>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 mb-2">Check 2-3 skills you used today.</p>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <!-- Creative -->
                            <div class="bg-purple-50 dark:bg-slate-900/30 p-2 rounded border border-purple-200 dark:border-purple-500/20">
                                <h4 class="text-purple-600 dark:text-purple-400 text-[10px] font-bold uppercase mb-1">Creative & Critical</h4>
                                <div class="space-y-1">
                                    ${checkBox('q3', 'Solved Problems', 'Solved Problems').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Shared Work', 'Shared Work').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Persevered', 'Persevered').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                </div>
                            </div>
                            <!-- Responsible -->
                            <div class="bg-emerald-50 dark:bg-slate-900/30 p-2 rounded border border-emerald-200 dark:border-emerald-500/20">
                                <h4 class="text-emerald-600 dark:text-emerald-400 text-[10px] font-bold uppercase mb-1">Responsible Individual</h4>
                                <div class="space-y-1">
                                    ${checkBox('q3', 'Accountable', 'Accountable').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Prepared', 'Prepared').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Made Plans', 'Made Plans').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                </div>
                            </div>
                            <!-- Collaborator -->
                            <div class="bg-blue-50 dark:bg-slate-900/30 p-2 rounded border border-blue-200 dark:border-blue-500/20">
                                <h4 class="text-blue-600 dark:text-blue-400 text-[10px] font-bold uppercase mb-1">Collaborator</h4>
                                <div class="space-y-1">
                                    ${checkBox('q3', 'Listened', 'Listened').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Mutual Respect', 'Respect').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Built Team', 'Teamwork').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                </div>
                            </div>
                            <!-- Learner -->
                            <div class="bg-amber-50 dark:bg-slate-900/30 p-2 rounded border border-amber-200 dark:border-amber-500/20">
                                <h4 class="text-amber-600 dark:text-amber-400 text-[10px] font-bold uppercase mb-1">Lifelong Learner</h4>
                                <div class="space-y-1">
                                    ${checkBox('q3', 'Authentic', 'Authentic').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Reflective', 'Reflective').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                    ${checkBox('q3', 'Used Technology', 'Used Tech').replace('p-2', 'p-1').replace('text-xs', 'text-[10px]')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Q4 Surprise -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q4')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-1">4. What surprised you?</h3>
                        <input type="text" oninput="window.saveReflection('q4', this.value)" value="${r.q4 || ''}" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-lg p-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-blue-500 placeholder-slate-400 dark:placeholder-slate-600" placeholder="One short sentence...">
                    </div>

                    <!-- Q5 Goals -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q5')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-2">5. Impact on career goals?</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${radioBox('q5', 'More Interested', 'More Interested')}
                            ${radioBox('q5', 'Learned New', 'Learned New')}
                            ${radioBox('q5', 'Still Exploring', 'Still Exploring')}
                            ${radioBox('q5', 'Not For Me', 'Not For Me')}
                        </div>
                    </div>

                    <!-- Q6 Next -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q6')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-1">6. What do you want to learn next?</h3>
                        <textarea oninput="window.saveReflection('q6', this.value)" class="w-full bg-gray-50 dark:bg-slate-900 border border-gray-300 dark:border-slate-600 rounded-lg p-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-blue-500 h-12 placeholder-slate-400 dark:placeholder-slate-600 resize-none" placeholder="I want to look up...">${r.q6 || ''}</textarea>
                    </div>

                    <!-- Q7 Rating -->
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-gray-200 dark:border-slate-700 relative">
                        ${getTeacherStamp('q7')}
                        <h3 class="text-slate-900 dark:text-white font-bold text-sm mb-2">7. Rate experience</h3>
                        <div class="grid grid-cols-2 gap-2">
                            ${radioBox('q7', 'Excellent', 'Excellent 🤩')}
                            ${radioBox('q7', 'Good', 'Good 🙂')}
                            ${radioBox('q7', 'Okay', 'Okay 😐')}
                            ${radioBox('q7', 'Needs Improvement', 'Needs Work 😕')}
                        </div>
                    </div>

                    <div class="sticky bottom-0 pb-4 pt-2 bg-gradient-to-t from-gray-50 dark:from-[#0f172a] via-gray-50 dark:via-[#0f172a] to-transparent flex gap-3 px-1">
                        <button onclick="window.manualSave()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/30 transition-all flex items-center justify-center"><i class="fas fa-save mr-2"></i> Save Now</button>
                        <button onclick="window.copyAllNotes()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center"><i class="fas fa-copy mr-2"></i> Copy All</button>
                    </div>
                </div>
            `;
        }

        // Start App
        initAuth().then(() => initApp());
    </script>
</body>
</html>
