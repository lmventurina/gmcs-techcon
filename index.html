<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPH TechCon V4</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/><text x=%2250%22 y=%2265%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2240%22 fill=%22white%22 text-anchor=%22middle%22>NPH</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; 
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .neon-border { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .tab-active { color: #60a5fa; border-bottom: 2px solid #60a5fa; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .login-bg { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .teacher-bg { background: radial-gradient(circle at center, #371b04 0%, #0f172a 100%); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header id="app-header" class="bg-slate-900 border-b border-slate-800 p-4 shadow-lg z-20 hidden">
        <div class="flex justify-between items-center max-w-4xl mx-auto w-full">
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">NPH <span id="header-highlight" class="text-blue-500">TechCon</span></h1>
                <p id="header-subtitle" class="text-xs text-slate-400">Student: ...</p>
            </div>
            <div class="text-right flex items-center gap-2">
                <!-- Teacher Actions -->
                <div id="teacher-actions" class="hidden flex items-center gap-2 mr-2">
                    <button onclick="window.renderView('teacher-dashboard')" id="btn-dash" class="text-slate-400 hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors border border-transparent hover:border-slate-600">
                        <i class="fas fa-list mr-1"></i> Data
                    </button>
                    <button onclick="window.renderView('teacher-presentation')" id="btn-slides" class="text-slate-400 hover:text-white px-2 py-1 rounded text-xs font-bold transition-colors border border-transparent hover:border-slate-600">
                        <i class="fas fa-chalkboard mr-1"></i> Slides
                    </button>
                    <div class="h-4 w-px bg-slate-700 mx-1"></div>
                    <button onclick="window.exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-xs font-bold transition-colors">
                        <i class="fas fa-file-csv mr-1"></i> Export
                    </button>
                    <button onclick="window.refreshTeacherData()" class="text-slate-400 hover:text-white px-2">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>

                <!-- Sync Status Indicator -->
                <div id="sync-status" class="text-xs font-mono text-slate-500 bg-slate-800 px-2 py-1 rounded border border-slate-700 transition-colors">
                    <i class="fas fa-circle-notch fa-spin mr-1"></i> CONNECTING
                </div>
                <button onclick="window.logout()" class="text-slate-500 hover:text-red-400 ml-2" aria-label="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 pb-24 max-w-4xl mx-auto w-full relative">
        <!-- Content injected via JS -->
        <div class="flex items-center justify-center h-full text-slate-500">
            <div class="text-center">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
                <p>Loading...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation (Student Only) -->
    <nav id="app-nav" class="bg-slate-900/95 backdrop-blur border-t border-slate-800 fixed bottom-0 w-full z-30 pb-safe hidden">
        <div class="flex justify-around items-center h-16 max-w-4xl mx-auto">
            <button onclick="window.renderView('home')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-home">
                <i class="fas fa-home text-lg mb-1"></i><span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.renderView('prep')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-prep">
                <i class="fas fa-clipboard-check text-lg mb-1"></i><span class="text-[10px] font-medium">Get Ready</span>
            </button>
            <button onclick="window.renderView('agenda')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-agenda">
                <i class="fas fa-clock text-lg mb-1"></i><span class="text-[10px] font-medium">Agenda</span>
            </button>
            <button onclick="window.renderView('passport')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-passport">
                <i class="fas fa-passport text-lg mb-1"></i><span class="text-[10px] font-medium">Passport</span>
            </button>
            <button onclick="window.renderView('reflection')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-blue-400 transition-colors" id="nav-reflection">
                <i class="fas fa-star text-lg mb-1"></i><span class="text-[10px] font-medium">Reflection</span>
            </button>
        </div>
    </nav>

    <!-- Teacher Modal -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 w-full max-w-2xl rounded-2xl border border-slate-700 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 rounded-t-2xl">
                <div>
                    <h2 class="text-xl font-bold text-white" id="modal-title">Student Name</h2>
                    <p class="text-xs text-slate-400" id="modal-id">ID: ...</p>
                </div>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6" id="modal-content"></div>
            <div class="p-4 border-t border-slate-700 bg-slate-800/30 rounded-b-2xl flex justify-end">
                <button onclick="window.closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Close</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-4 py-2 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2">
        <i class="fas fa-check-circle"></i> <span id="toast-msg">Saved!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCIqh4WFNa5OarJuiE_28T196AesGJez-4",
            authDomain: "techcon-8b01e.firebaseapp.com",
            projectId: "techcon-8b01e",
            storageBucket: "techcon-8b01e.firebasestorage.app",
            messagingSenderId: "535782934014",
            appId: "1:535782934014:web:a2df7a9fcb292a152aecaf",
            measurementId: "G-J1073SXDQB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = 'nph-techcon-v2';

        // --- STATE ---
        let userMode = 'student'; // 'student' or 'teacher'
        let currentEmail = null;
        let currentView = 'login';
        let isGuestMode = false;
        
        let appData = {
            studentName: '',
            notes: { iot: '', sec: '', ai: '', panel: '', custom_q: '' },
            checklist: { charged: false, pack: false, login: false, cisco: false },
            reflection: { q1: '', q2: [], q3: [], q4: '', q5: '', q6: '', q7: '' },
            teacherComment: ''
        };

        let teacherData = []; // Stores all student profiles
        let saveTimeout = null;
        let unsubscribeSnapshot = null;

        // --- INIT ---
        const initApp = () => {
            const savedEmail = localStorage.getItem('nph_student_email');
            const savedName = localStorage.getItem('nph_student_name');
            
            if (savedEmail && savedName) {
                currentEmail = savedEmail;
                appData.studentName = savedName;
                startDataListener(currentEmail);
                window.renderView('home');
            } else {
                window.renderView('login');
            }
        };

        // --- STUDENT LOGIC ---
        const startDataListener = (emailKey) => {
            if (isGuestMode) {
                const saved = localStorage.getItem('nph_guest_data');
                if (saved) { try { appData = JSON.parse(saved); updateHeader(); } catch(e) {} }
                updateSyncStatus('guest');
                return;
            }
            if (!emailKey) return;
            
            const safeId = emailKey.replace(/\//g, '_'); 
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const fetchedData = docSnap.data();
                    // Merge deeply to avoid overwriting nested objects like reflection
                    appData = {
                        ...appData,
                        ...fetchedData,
                        reflection: { ...appData.reflection, ...(fetchedData.reflection || {}) },
                        notes: { ...appData.notes, ...(fetchedData.notes || {}) },
                        checklist: { ...appData.checklist, ...(fetchedData.checklist || {}) }
                    };
                    updateHeader();
                    if (currentView !== 'login' && userMode === 'student') window.renderView(currentView);
                } else {
                    saveToCloud();
                }
                updateSyncStatus('online');
            }, (error) => {
                console.error("Sync error", error);
                updateSyncStatus('offline');
                if(!isGuestMode) {
                    const guestConfirm = confirm("Cloud Connection Failed. Switch to Guest Mode?");
                    if(guestConfirm) window.enableGuestMode(appData.studentName);
                }
            });
        };

        async function saveToCloud() {
            if (isGuestMode) {
                localStorage.setItem('nph_guest_data', JSON.stringify(appData));
                updateSyncStatus('guest');
                return;
            }
            if (!currentEmail) return;
            try {
                const safeId = currentEmail.replace(/\//g, '_');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', safeId);
                await setDoc(docRef, appData, { merge: true });
                updateSyncStatus('online');
            } catch (e) {
                console.error("Save failed", e);
                updateSyncStatus('offline');
            }
        }

        // --- TEACHER LOGIC ---
        window.attemptTeacherLogin = () => {
            const pin = document.getElementById('teacher-pin').value;
            if (pin === "NPH2025") {
                userMode = 'teacher';
                document.getElementById('teacher-login-error').classList.add('hidden');
                window.renderView('teacher-dashboard');
                window.refreshTeacherData();
            } else {
                document.getElementById('teacher-login-error').classList.remove('hidden');
            }
        };

        window.refreshTeacherData = async () => {
            try {
                updateSyncStatus('syncing');
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'student_profiles'));
                const querySnapshot = await getDocs(q);
                teacherData = [];
                querySnapshot.forEach((doc) => {
                    teacherData.push({ id: doc.id, ...doc.data() });
                });
                if(currentView === 'teacher-dashboard') renderTeacherTable(teacherData);
                updateSyncStatus('online');
            } catch (e) {
                console.error("Teacher Fetch Error", e);
                updateSyncStatus('offline');
            }
        };

        window.deleteStudent = async (id) => {
            if(!confirm("Are you sure you want to PERMANENTLY delete this student's data? This cannot be undone.")) return;
            
            try {
                updateSyncStatus('syncing');
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', id));
                // Update local data immediately
                teacherData = teacherData.filter(s => s.id !== id);
                renderTeacherTable(teacherData);
                updateSyncStatus('online');
                showToast("Student deleted.");
            } catch (e) {
                console.error("Delete failed", e);
                updateSyncStatus('offline');
                alert("Failed to delete. Please check connection.");
            }
        };

        window.saveTeacherComment = async (studentId) => {
            const comment = document.getElementById('teacher-comment-input').value;
            try {
                updateSyncStatus('syncing');
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_profiles', studentId);
                await setDoc(docRef, { teacherComment: comment }, { merge: true });
                
                // Update local data
                const s = teacherData.find(s => s.id === studentId);
                if (s) s.teacherComment = comment;
                
                showToast("Feedback Saved!");
                updateSyncStatus('online');
            } catch (e) {
                console.error("Comment save failed", e);
                alert("Failed to save feedback.");
            }
        };

        // --- SHARED UI LOGIC ---
        function updateHeader() {
            const subtitle = document.getElementById('header-subtitle');
            const title = document.getElementById('header-highlight');
            
            if (userMode === 'student') {
                title.className = "text-blue-500";
                title.innerText = "TechCon";
                subtitle.innerText = `Student: ${appData.studentName || 'Guest'}`;
                document.getElementById('teacher-actions').classList.add('hidden');
            } else {
                title.className = "text-amber-500";
                title.innerText = "Faculty";
                subtitle.innerText = "Monitor Dashboard";
                document.getElementById('teacher-actions').classList.remove('hidden');
                
                // Update active state for teacher nav
                const btnDash = document.getElementById('btn-dash');
                const btnSlides = document.getElementById('btn-slides');
                
                if(currentView === 'teacher-dashboard' && btnDash) {
                    btnDash.classList.add('bg-slate-700', 'text-white');
                    btnDash.classList.remove('text-slate-400');
                    btnSlides.classList.remove('bg-slate-700', 'text-white');
                    btnSlides.classList.add('text-slate-400');
                } else if (currentView === 'teacher-presentation' && btnSlides) {
                    btnSlides.classList.add('bg-slate-700', 'text-white');
                    btnSlides.classList.remove('text-slate-400');
                    btnDash.classList.remove('bg-slate-700', 'text-white');
                    btnDash.classList.add('text-slate-400');
                }
            }
        }

        const updateSyncStatus = (status) => {
            const el = document.getElementById('sync-status');
            if (!el) return;
            
            if (status === 'online') {
                el.innerHTML = '<i class="fas fa-cloud text-emerald-400 mr-1"></i> SYNCED';
                el.className = "text-xs font-mono text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded border border-emerald-400/20 transition-colors";
            } else if (status === 'syncing') {
                el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-400 mr-1"></i> SAVING';
                el.className = "text-xs font-mono text-blue-400 bg-blue-400/10 px-2 py-1 rounded border border-blue-400/20 transition-colors";
            } else if (status === 'guest') {
                el.innerHTML = '<i class="fas fa-hdd text-amber-400 mr-1"></i> LOCAL';
                el.className = "text-xs font-mono text-amber-400 bg-amber-400/10 px-2 py-1 rounded border border-amber-400/20 transition-colors";
            } else {
                el.innerHTML = '<i class="fas fa-wifi-slash text-red-400 mr-1"></i> OFFLINE';
                el.className = "text-xs font-mono text-red-400 bg-red-400/10 px-2 py-1 rounded border border-red-400/20 transition-colors";
            }
        };

        window.renderView = (viewName) => {
            currentView = viewName;
            const container = document.getElementById('app-content');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('app-nav');
            
            updateHeader();

            // Toggle Navigation Visibility
            if (viewName === 'login' || viewName === 'teacher-login') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
                if (userMode === 'student') nav.classList.remove('hidden');
                else nav.classList.add('hidden'); // No bottom nav for teachers
            }

            // Student Nav State
            if (userMode === 'student') {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-blue-400');
                    btn.classList.add('text-slate-400');
                });
                const activeBtn = document.getElementById(`nav-${viewName}`);
                if(activeBtn) {
                    activeBtn.classList.remove('text-slate-400');
                    activeBtn.classList.add('text-blue-400');
                }
            }

            // Route Render
            if (viewName === 'login') container.innerHTML = getLoginView();
            else if (viewName === 'teacher-login') container.innerHTML = getTeacherLoginView();
            else if (viewName === 'teacher-dashboard') container.innerHTML = getTeacherDashboardView();
            else if (viewName === 'teacher-presentation') container.innerHTML = getTeacherPresentationView();
            else if (viewName === 'home') container.innerHTML = getHomeView();
            else if (viewName === 'prep') container.innerHTML = getPrepView();
            else if (viewName === 'agenda') container.innerHTML = getAgendaView();
            else if (viewName === 'passport') container.innerHTML = getPassportView();
            else if (viewName === 'reflection') container.innerHTML = getReflectionView();
            
            // Post-render actions
            if (viewName === 'teacher-dashboard') renderTeacherTable(teacherData);
        };

        // --- ACTIONS ---
        window.login = async () => {
            const name = document.getElementById('student-name-input').value.trim();
            const email = document.getElementById('student-email-input').value.trim().toLowerCase();
            
            if (name.length === 0 || email.length === 0) { alert("Please enter both Name and Email."); return; }

            localStorage.setItem('nph_student_email', email);
            localStorage.setItem('nph_student_name', name);
            
            appData.studentName = name; 
            currentEmail = email;
            userMode = 'student';
            
            startDataListener(email);
            window.renderView('home');
        };

        window.enableGuestMode = (name) => {
            isGuestMode = true;
            userMode = 'student';
            appData.studentName = name || "Guest";
            startDataListener(null); 
            window.renderView('home');
            alert("Guest Mode Active: Notes save to THIS device only.");
        };

        window.logout = () => {
            localStorage.removeItem('nph_student_email');
            localStorage.removeItem('nph_student_name');
            currentEmail = null;
            isGuestMode = false;
            userMode = 'student';
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            // Reset Data
            appData = { studentName: '', notes: { iot: '', sec: '', ai: '', panel: '', custom_q: '' }, checklist: { charged: false, pack: false, login: false, cisco: false }, reflection: { q1: '', q2: [], q3: [], q4: '', q5: '', q6: '', q7: '' }, teacherComment: '' };
            window.renderView('login');
        };

        window.toggleCheck = (key) => { appData.checklist[key] = !appData.checklist[key]; window.renderView('prep'); saveToCloud(); };
        window.saveNote = (key, value) => { 
            appData.notes[key] = value; 
            updateSyncStatus('syncing'); 
            clearTimeout(saveTimeout); 
            // Autosave set to 60 minutes
            saveTimeout = setTimeout(saveToCloud, 3600000); 
        };

        window.saveReflection = (key, value) => {
            if(Array.isArray(appData.reflection[key])) {
                // Handle Checkbox Arrays
                const index = appData.reflection[key].indexOf(value);
                if (index > -1) {
                    appData.reflection[key].splice(index, 1);
                } else {
                    appData.reflection[key].push(value);
                }
            } else {
                // Handle Text/Radio
                appData.reflection[key] = value;
            }
            updateSyncStatus('syncing');
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveToCloud, 3600000); 
        }

        window.manualSave = () => {
            clearTimeout(saveTimeout); // Clear any pending autosave
            saveToCloud().then(() => showToast("Saved to Cloud!"));
        };

        // --- TEACHER HELPERS ---
        function updateTeacherCharts(data) {
            const counts = { 'Excellent': 0, 'Good': 0, 'Okay': 0, 'Needs Improvement': 0 };
            let totalRated = 0;

            data.forEach(s => {
                const r = s.reflection?.q7;
                if (r) {
                    if (counts[r] !== undefined) {
                        counts[r]++;
                        totalRated++;
                    }
                }
            });

            // Avoid divide by zero
            const base = totalRated === 0 ? 1 : totalRated;

            // Update DOM
            const setBar = (idSuffix, count) => {
                const percent = (count / base) * 100;
                const elBar = document.getElementById(`bar-${idSuffix}`);
                const elVal = document.getElementById(`val-${idSuffix}`);
                if(elBar) elBar.style.width = `${percent}%`;
                if(elVal) elVal.innerText = `${count} (${Math.round(percent)}%)`;
            };

            setBar('excellent', counts['Excellent']);
            setBar('good', counts['Good']);
            setBar('okay', counts['Okay']);
            setBar('bad', counts['Needs Improvement']);
        }

        function renderTeacherTable(data) {
            const tbody = document.getElementById('teacher-table-body');
            
            // Update Stats & Charts
            if(document.getElementById('stat-count')) {
                document.getElementById('stat-count').innerText = data.length;
                document.getElementById('stat-active').innerText = data.filter(s => {
                    const r = s.reflection || {};
                    return (r.q1 && r.q1.length > 0);
                }).length;
                
                // Update the Satisfaction Graph
                updateTeacherCharts(data);
            }

            if(!tbody) return;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">No students found yet.</td></tr>`;
                return;
            }

            data.forEach(student => {
                const notes = student.notes || {};
                const list = student.checklist || {};
                const r = student.reflection || {};
                const has = (txt) => txt && txt.length > 2 ? '<i class="fas fa-check text-emerald-500"></i>' : '<span class="text-slate-600">-</span>';
                const hasReflect = (r.q1 && r.q1.length > 0) ? '<i class="fas fa-check text-emerald-500"></i>' : '<span class="text-slate-600">-</span>';
                
                const checkIcon = (val, icon) => `<i class="fas ${icon} ${val ? 'text-emerald-400' : 'text-slate-700'} text-xs"></i>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-700/50 transition-colors border-b border-slate-700/50 last:border-0";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">
                        <div>${student.studentName || 'Unknown'}</div>
                        <div class="text-xs text-slate-500 font-mono truncate max-w-[150px]">${student.id}</div>
                    </td>
                    <td class="p-3 text-center flex gap-1 justify-center items-center h-full">
                        ${checkIcon(list.charged, 'fa-bolt')}

        window.exportCSV = () => {

            let csv = "Name,Email_ID,Teacher_Feedback,Charged,Packed,Login_Verified,Cisco_Installed,IoT Notes,Security Notes,AI Notes,Panel Notes,Custom Questions,Reflection_Learned,Reflection_Careers,Reflection_Skills,Reflection_Surprised,Reflection_Goals,Reflection_LearnMore,Reflection_Rating\n";
            teacherData.forEach(s => {
                const n = s.notes || {};
                const l = s.checklist || {};
                const r = s.reflection || {};
                const clean = (txt) => `"${(txt || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                const cleanArr = (arr) => `"${(arr || []).join('; ')}"`;
                
                csv += `${clean(s.studentName)},${clean(s.id)},${clean(s.teacherComment)},${l.charged},${l.pack},${l.login},${l.cisco},${clean(n.iot)},${clean(n.sec)},${clean(n.ai)},${clean(n.panel)},${clean(n.custom_q)},${clean(r.q1)},${cleanArr(r.q2)},${cleanArr(r.q3)},${clean(r.q4)},${clean(r.q5)},${clean(r.q6)},${clean(r.q7)}\n`;
            });
            const url = window.URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            const a = document.createElement('a');
            a.setAttribute('hidden', ''); a.setAttribute('href', url); a.setAttribute('download', 'nph_techcon_data.csv');

justify-center"><i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i></div></div><div class="ml-3"><span class="block text-sm font-medium text-slate-200 group-hover:text-white">Verify School Login</span></div></label><label class="flex items-start cursor-pointer group"><div class="relative flex items-center"><input type="checkbox" id="check-cisco" class="peer sr-only" ${isCisco ? 'checked' : ''} onchange="window.toggleCheck('cisco')"><div class="w-6 h-6 bg-slate-900 border-2 border-slate-600 rounded peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center"><i class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100"></i></div></div><div class="ml-3"><span class="block text-sm font-medium text-slate-200 group-hover:text-white">Install Cisco Packet Tracer</span><span class="block text-xs text-slate-500">Required for Network Security rotation.</span></div></label></div></div><div class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg"><h3 class="text-amber-400 font-bold mb-4 flex items-center"><i class="fas fa-lightbulb mr-2"></i> Panel Q&A Ideas</h3><div class="space-y-3 max-h-60 overflow-y-auto pr-2 mb-4">${questions.map(q => `<div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-amber-500/50 transition-colors group"><p class="text-sm text-slate-300 group-hover:text-white">"${q}"</p></div>`).join('')}</div><h3 class="text-amber-400 font-bold mb-2 flex items-center pt-4 border-t border-slate-700"><i class="fas fa-pen mr-2"></i> My Questions</h3><p class="text-xs text-slate-400 mb-2">Write your own questions here:</p><textarea id="note-custom-q" oninput="window.saveNote('custom_q', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500 h-24 placeholder-slate-600 mb-2" placeholder="I want to ask...">${appData.notes?.custom_q || ''}</textarea><bu         }

                        <p class="text-slate-200 text-sm leading-relaxed">${tComment}</p>
                    </div>
                `;

                <label class="flex items-start space-x-3 p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 hover:border-blue-500/50 cursor-pointer">

                </label>`;
            };

            const radioBox = (key, val, label) => {
                const checked = r[key] === val ? 'checked' : '';

                </label>`;
            };

                <div class="space-y-6 fade-in pt-4 pb-8">
                    <div class="text-center">
